name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:rules
      # Catches bundling regressions in the Worker without contacting Cloudflare.
      - working-directory: worker
        run: npx wrangler deploy --dry-run --env dev --outdir "$RUNNER_TEMP/worker-bundle"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # The action's default package list includes the legacy `tools` package,
      # which current command-line tools no longer provide, so name them here.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - working-directory: android
        run: ./gradlew testDevDebugUnitTest lintDevDebug assembleDevDebug
      - working-directory: android
        run: ./gradlew testProdDebugUnitTest lintProdRelease assembleProdRelease
